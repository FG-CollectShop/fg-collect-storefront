<!doctype html>
<html lang="{{ site.LanguageCode | default "en-us" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="min-h-screen flex flex-col bg-white text-gray-900 antialiased">
    {{ partial "header.html" . }}
    <main class="flex-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script src="/js/cart.js" defer></script>
    {{ block "scripts" . }}{{ end }}
  </body>
</html>
