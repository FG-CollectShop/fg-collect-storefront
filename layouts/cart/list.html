{{ define "main" }}
<section class="max-w-4xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold tracking-tight">Cart</h1>

  <div data-cart-empty class="mt-8 text-center text-gray-500 py-16 border border-dashed border-gray-300 rounded-lg hidden">
    Your cart is empty.
    <div class="mt-3">
      <a href="/tcg/" class="inline-block px-4 py-2 bg-black text-white text-sm rounded-md hover:bg-gray-800">Browse TCGs</a>
    </div>
  </div>

  <div data-cart-wrapper class="mt-8 grid md:grid-cols-3 gap-8 hidden">
    <div class="md:col-span-2">
      <ul data-cart-items class="divide-y divide-gray-200 border border-gray-200 rounded-lg"></ul>
    </div>

    <aside class="border border-gray-200 rounded-lg p-5 h-fit">
      <div class="text-sm font-semibold uppercase tracking-wider text-gray-500">Summary</div>
      <dl class="mt-4 space-y-2 text-sm">
        <div class="flex justify-between">
          <dt class="text-gray-600">Subtotal</dt>
          <dd data-cart-subtotal>$0.00</dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-gray-600">Shipping</dt>
          <dd class="text-gray-400">Calculated at checkout</dd>
        </div>
      </dl>
      <div class="mt-4 pt-4 border-t border-gray-200 flex justify-between font-semibold">
        <span>Total</span>
        <span data-cart-total>$0.00</span>
      </div>
      <button
        type="button"
        data-checkout-btn
        class="mt-5 w-full px-4 py-2.5 bg-black text-white text-sm font-medium rounded-md hover:bg-gray-800 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Checkout
      </button>
      <p data-checkout-error class="mt-2 text-xs text-red-600 hidden"></p>
      <p class="mt-2 text-xs text-gray-500 text-center">Secure payment via Stripe</p>
    </aside>
  </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="/js/checkout.js" defer></script>
{{ end }}
