<header class="border-b border-gray-200 bg-white sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
    <a href="/" class="font-bold text-xl tracking-tight shrink-0">{{ site.Params.brand }}</a>

    <nav class="hidden md:flex items-center gap-4 text-sm">
      {{ range sort site.Data.games "order" }}
      <a href="/tcg/{{ .id }}/" class="text-gray-700 hover:text-black">{{ .shortName }}</a>
      {{ end }}
      <a href="/tcg/" class="text-gray-400 hover:text-black">All TCGs</a>
    </nav>

    <form action="/search/" method="get" class="hidden md:block flex-1 max-w-sm ml-auto">
      <input
        type="search"
        name="q"
        placeholder="Search cards, sets, booster boxes..."
        class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black/10"
      />
    </form>

    <div class="ml-auto md:ml-0">
      {{ partial "cart-badge.html" . }}
    </div>
  </div>
</header>
