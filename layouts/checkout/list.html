{{ define "main" }}
<section class="max-w-2xl mx-auto px-4 py-20 text-center">
  {{ if eq .Params.checkoutState "success" }}
    <div class="text-5xl">✓</div>
    <h1 class="mt-4 text-3xl font-bold tracking-tight">Thanks for your order</h1>
    <p class="mt-3 text-gray-600">
      We'll email you a receipt and a pick/pack update when your order ships.
    </p>
    <a href="/tcg/" class="mt-6 inline-block px-5 py-2.5 bg-black text-white text-sm font-medium rounded-md hover:bg-gray-800">
      Keep shopping
    </a>
    <script>
      // Clear the cart on successful return from Stripe.
      try { localStorage.removeItem('fg-cart-v1'); } catch (e) {}
    </script>
  {{ else }}
    <div class="text-5xl">×</div>
    <h1 class="mt-4 text-3xl font-bold tracking-tight">Checkout canceled</h1>
    <p class="mt-3 text-gray-600">
      No charge was made. Your cart is still saved.
    </p>
    <a href="/cart/" class="mt-6 inline-block px-5 py-2.5 bg-black text-white text-sm font-medium rounded-md hover:bg-gray-800">
      Back to cart
    </a>
  {{ end }}
</section>
{{ end }}
