name: Build and deploy storefront

on:
  push:
    branches: [main, dev]

  # Fired by fg-collect-core whenever inventory changes materially.
  repository_dispatch:
    types: [inventory-changed]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.155.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo (extended)
        run: |
          curl -sSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Build
        env:
          HUGO_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          HUGO_ENV:         ${{ github.ref_name == 'main' && 'production' || 'development' }}
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=fg-collect-storefront --branch=${{ github.ref_name }}
